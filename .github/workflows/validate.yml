name: Validar WMS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packem-wms
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar sintaxe e APIs
        run: npm test
      - name: Preparar PostgreSQL isolado para testes NFC
        run: npm install --no-save --package-lock=false @electric-sql/pglite@0.5.10
      - name: Validar migrações e fila NFC sem banco de produção
        run: node tests/sql/nfc-mobile.mjs

